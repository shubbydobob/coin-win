name: CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # check 에는 test / checkstyle / spotbugs / ArchUnit / JaCoCo 90% 게이트가 모두 걸려 있다.
      - name: Run check
        run: ./gradlew check --no-daemon

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: build-reports
          path: build/reports/
          retention-days: 7
