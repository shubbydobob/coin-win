# 로컬 개발용 PostgreSQL. `docker compose up -d db`
#
# 통합 테스트는 이 컨테이너를 쓰지 않는다 — Testcontainers 가 자기 컨테이너를 띄운다.
# 그래도 이미지 태그는 gradle/libs.versions.toml 의 postgresImage 와 같아야 한다.
# 두 곳이 갈리면 로컬에서 통과한 SQL 이 통합 테스트에서 방언 차이로 깨진다.
services:
  db:
    # Phase 7 에서 postgres:18-alpine 을 떠났다. RAG 인덱스가 vector 확장을 요구한다.
    image: pgvector/pgvector:pg18
    container_name: coinwin-db
    environment:
      POSTGRES_DB: coinwin
      POSTGRES_USER: coinwin
      POSTGRES_PASSWORD: coinwin
    ports:
      - "5432:5432"
    volumes:
      # PG18 이미지는 데이터를 /var/lib/postgresql/{major}/docker 에 둔다. 옛 관례대로
      # /var/lib/postgresql/data 에 마운트하면 컨테이너가 "쓰이지 않는 마운트" 라며 기동을
      # 거부한다 — 볼륨 밖에 데이터를 쓰는 것을 막아 주는 검사다. 한 칸 위에 건다.
      #
      # Phase 7 에서 이미지를 pgvector/pgvector:pg18 로 바꾸면서 이 줄을 함께 고치지 않았고,
      # 통합 테스트는 Testcontainers 를 쓰므로 아무도 몰랐다. Phase 8 의 브라우저 확인이
      # 처음으로 이 컨테이너를 띄우면서 드러났다.
      - coinwin-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coinwin -d coinwin"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  coinwin-db-data:
