# 모든 버전은 이 파일 한 곳에만 존재한다. build.gradle.kts 에 리터럴 버전을 쓰지 않는다.
# 확인 시점: 2026-08-21 (Maven Central / Gradle Plugin Portal metadata)

[versions]
# Spring Boot 3.5 는 2026-06-30 OSS EOL. 4.1 라인이 현재 지원 라인이다. → docs/adr/007
springBoot = "4.1.1"
dependencyManagement = "1.1.7"

# Boot 4 는 JUnit Jupiter 6 를 가져온다. ArchUnit 은 junit5 가 아니라 junit6 모듈을 써야 한다.
archunit = "1.5.0"

springdoc = "3.1.0"

# 정적 분석 도구 (Gradle 플러그인이 아니라 도구 자체의 버전)
checkstyle = "14.0.0"
spotbugs = "4.10.4"
spotbugsPlugin = "6.5.11"
jacoco = "0.8.15"

# Phase 3 (시장 데이터). PostgreSQL 드라이버와 Flyway 는 Spring Boot BOM 이 버전을 관리하므로
# 여기에 적지 않는다 — 버전이 아예 없는 것이 한 곳에 모으는 것보다 낫다.
#
# Testcontainers 는 예외다. Boot 4.1 의 BOM 은 spring-boot-testcontainers 는 관리하지만
# org.testcontainers:* 자체는 관리하지 않는다("Could not find org.testcontainers:postgresql:.").
# 그래서 여기에 명시한다.
testcontainers = "1.21.4"

# 컨테이너 이미지 태그도 BOM 이 모르므로 여기에 둔다. compose.yaml 과 통합 테스트가
# 같은 이미지를 써야 "로컬에서 되는데 CI 에서 깨지는" 방언 차이가 생기지 않는다.
#
# Phase 7 에서 postgres:18-alpine 을 떠났다. RAG 인덱스가 vector 확장을 요구하는데
# 공식 이미지에는 없다. pgvector 이미지는 같은 pg18 위에 확장만 얹은 것이다.
postgresImage = "pgvector/pgvector:pg18"

# Phase 5 (매매 기록). 원본 com.querydsl 은 2024-11 이후 미유지 → io.github.openfeign.querydsl.
# JPA / Hibernate 자체의 버전은 Spring Boot BOM 이 관리하므로 여기에 적지 않는다.
querydsl = "7.6"

# Phase 7 (Spring AI). 2.0 라인이 Boot 4.0/4.1 · Framework 7 용이다. 1.1.x 는 Boot 3.5 용이라
# 이 프로젝트에서 쓸 수 없다. 개별 스타터 버전은 BOM 이 관리하므로 여기에 적지 않는다.
springAi = "2.0.1"

# Phase 8 (프론트엔드). 플러그인이 이 버전의 Node 를 내려받는다 — 로컬에 설치된 npm 을 부르지
# 않는다. Node 버전이 사람마다 다르면 "내 컴퓨터에서는 되는데" 가 그대로 재발한다.
# 패키지 버전은 여기가 아니라 frontend/package.json 에 있다. 여기 적으면 세 번째 사본이 된다.
# 근거: docs/spec/phase8-frontend.md § 2 · § 9.1
node = "24.14.0"
nodePlugin = "7.1.0"

[libraries]
spring-ai-bom = { module = "org.springframework.ai:spring-ai-bom", version.ref = "springAi" }
springdoc-openapi-webmvc = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
archunit-junit6 = { module = "com.tngtech.archunit:archunit-junit6", version.ref = "archunit" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql", version.ref = "testcontainers" }
querydsl-jpa = { module = "io.github.openfeign.querydsl:querydsl-jpa", version.ref = "querydsl" }
querydsl-apt = { module = "io.github.openfeign.querydsl:querydsl-apt", version.ref = "querydsl" }

[plugins]
springBoot = { id = "org.springframework.boot", version.ref = "springBoot" }
dependencyManagement = { id = "io.spring.dependency-management", version.ref = "dependencyManagement" }
spotbugs = { id = "com.github.spotbugs", version.ref = "spotbugsPlugin" }
node = { id = "com.github.node-gradle.node", version.ref = "nodePlugin" }
