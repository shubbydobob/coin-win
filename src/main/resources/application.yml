spring:
  application:
    name: coinwin

  # 시크릿은 저장소 루트의 .env 에서 읽는다. 없으면 없는 대로 뜬다(optional).
  #
  # 이 파일에 값을 적지 않는 이유는 하나다 — application.yml 은 커밋되고 .env 는 .gitignore 가
  # 막는다. 환경변수로만 받던 것을 파일로 넓힌 이유는 셸을 닫으면 사라져 매번 다시 넣어야
  # 했기 때문이다.
  #
  # [.properties] 가 붙어야 확장자 없는 파일을 properties 형식으로 읽는다. 빼면 스프링이
  # 형식을 몰라 조용히 무시하고, 그러면 키를 적었는데 안 붙는 상태가 된다.
  config:
    import: "optional:file:.env[.properties]"

  # Phase 3 부터 캔들을 저장한다. 로컬 DB 는 `docker compose up -d db`.
  # 자격 증명을 환경변수로 덮어쓸 수 있게 두되 기본값은 compose.yaml 과 맞춘다.
  datasource:
    url: ${COINWIN_DB_URL:jdbc:postgresql://localhost:5432/coinwin}
    username: ${COINWIN_DB_USER:coinwin}
    password: ${COINWIN_DB_PASSWORD:coinwin}

  # 스키마는 Flyway 만 만든다. Phase 5 에서 JPA 가 들어왔으므로 ddl-auto 를 명시적으로 꺼 둔다 —
  # 기본값에 기대면 Boot 버전이 바뀔 때 Hibernate 가 스키마를 손대기 시작할 수 있고,
  # 그러면 마이그레이션이 유일한 스키마 출처라는 전제가 조용히 무너진다.
  jpa:
    hibernate:
      ddl-auto: none
    # 뷰 렌더링 중에 세션이 열려 있으면 지연 로딩이 어디서든 터진다. 어댑터가 경계를 갖는다.
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  # Phase 7 — Spring AI. 키가 없으면 AI 어댑터 빈이 올라오지 않고 /api/ai/** 만 503 이 된다.
  # 앱과 나머지 기능은 그대로 뜬다. 근거: docs/spec/phase7-spring-ai.md § 8
  # 어떤 모델 자동 구성을 켜고 끄는지는 여기가 아니라 SpringAiEnabledOnlyWithApiKey 에 있다.
  # 테스트 리소스의 application.yml 이 이 파일을 통째로 가리기 때문이다.
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: ${COINWIN_AI_CHAT_MODEL:gpt-5.6-luna}
          # 계획 파싱은 창작이 아니라 옮겨 적기다. 같은 문장은 같은 초안을 내야 한다.
          temperature: 0
      embedding:
        options:
          model: ${COINWIN_AI_EMBEDDING_MODEL:text-embedding-3-small}
    vectorstore:
      pgvector:
        # 스키마는 Flyway 만 만든다. 2.0 기본값이지만 명시한다 — 기본값에 기대면
        # 버전이 바뀔 때 마이그레이션이 유일한 스키마 출처라는 전제가 조용히 무너진다.
        initialize-schema: false
        # V3__vector_store.sql 의 vector(1536) 과 같은 수여야 한다. 차원이 다른 벡터가
        # 한 테이블에 섞이면 검색이 예외 없이 조용히 망가진다.
        dimensions: 1536
        index-type: HNSW
        distance-type: COSINE_DISTANCE

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha

coinwin:
  market:
    binance:
      # 공개 엔드포인트만 쓴다. API 키가 필요 없다. 근거: .claude/docs/scope.md
      base-url: ${COINWIN_BINANCE_URL:https://fapi.binance.com}
      # 현물은 호스트가 다르다. 비트코인 현물가 하나 때문에 생겼고, 그 값이 무기한가와
      # 갈라지는 것이 관측값이므로 같은 주소에서 읽을 수는 없다.
      spot-base-url: ${COINWIN_BINANCE_SPOT_URL:https://api.binance.com}
      # 바이낸스 klines 는 1회 최대 1500개를 준다. 이보다 크게 요청하면 조용히 잘린다.
      max-candles-per-request: 1500
      connect-timeout: 3s
      read-timeout: 10s
      # 호가는 묻지 않고 받는다. 거래소가 100ms 마다 20단을 밀어 주므로 화면이 얼마나 자주
      # 물어도 거래소 한도와 무관해지고, 응답에 실리는 호가가 3초 전이 아니라 방금 것이 된다.
      #
      # 24시간 시세는 여전히 REST 다 — 선물 @ticker 스트림이 구독을 받아 주면서 한 건도
      # 보내지 않는 것을 확인했다(2026-08-25). 같은 연결의 호가 스트림은 정상이었다.
      #
      # 끄면 전부 REST 로 돌아간다. 물러섬은 늘 살아 있으므로 이 스위치는 기능을 없애지 않는다.
      stream:
        enabled: ${COINWIN_BINANCE_STREAM:true}
        url: ${COINWIN_BINANCE_STREAM_URL:wss://fstream.binance.com/ws}
        symbol: BTCUSDT
        depth: 20
        connect-timeout: 3s
        # 이보다 오래된 호가는 스트림이 살아 있다고 보지 않는다. 100ms 마다 오는 것이라
        # 넉넉한 값이고, 이 시간이 지나면 REST 로 물러선다.
        freshness: 3s
        # 흐름이 멎었는지 확인하는 주기. 끊긴 경우와 소리 없이 멎은 경우를 같이 다룬다.
        reconnect-delay: 10s
    upbit:
      # 원/USDT 환율. 바이낸스에는 원화 시장이 없어 거래소가 하나 늘었다.
      # 시세 조회는 공개 엔드포인트라 키가 필요 없다.
      base-url: ${COINWIN_UPBIT_URL:https://api.upbit.com}
      market: KRW-USDT
      connect-timeout: 3s
      read-timeout: 10s
    yahoo:
      # 바이낸스에 없는 셋(나스닥 선물 · S&P 500 지수 · 달러지수)만 여기서 읽는다.
      # 문서화된 API 가 아니다 — 예고 없이 막히거나 모양이 바뀔 수 있고, 그때는 그 줄만 빠진다.
      base-url: ${COINWIN_YAHOO_URL:https://query1.finance.yahoo.com}
      connect-timeout: 3s
      read-timeout: 10s
  # 매매 봇. 근거와 조건은 docs/spec/trading-bot.md, 해제 범위는 .claude/docs/scope.md.
  #
  # **기본이 꺼짐이다.** 앱을 띄운 것과 봇을 켠 것은 다른 결정이고, 기본이 켜짐이면 이
  # 저장소를 처음 실행하는 사람의 계좌에서 루프가 돈다.
  #
  # **모드의 기본은 장부(PAPER)다.** 지금은 장부 브로커밖에 없어 실계좌로 갈 수도 없다.
  # 테스트넷·실계좌 어댑터가 생겨도 전환은 환경변수를 명시적으로 바꿔야 하고, 실패하면
  # 앱이 실패한다 — 조용히 장부로 내려오지 않는다.
  trading:
    enabled: ${COINWIN_TRADING_ENABLED:false}
    mode: ${COINWIN_TRADING_MODE:PAPER}
    # 주기는 전략의 일부인데 전략이 없다. 1분은 자리표시자다.
    cycle: ${COINWIN_TRADING_CYCLE:PT1M}
    candles: 300
    # 장부의 시작 자산. 한계가 전부 이것의 비율이다.
    equity: ${COINWIN_TRADING_EQUITY:800}
    # 봇은 지정가를 내지 않으므로 메이커가 될 수 없다. 미끄러짐은 자리표시자다.
    taker-fee-percent: 0.05
    slippage-percent: 0.02
    # 무엇이 판단하는가.
    #   hold       — 아무것도 하지 않는다. **옳은 기본값이다** (진입 규칙이 두 번 반증됐다)
    #   stop-guard — 진입은 여전히 안 하고, 손절 없는 포지션에 손절만 건다.
    #                엣지를 요구하지 않는 유일한 규칙이라 지금도 꽂을 수 있다.
    strategy: ${COINWIN_TRADING_STRATEGY:hold}
    # stop-guard 의 손절 거리(%). **근거 있는 수가 아니라 자리표시자다** —
    # 얼마나 멀어야 무효화만 잡고 잡음에 안 걸리는지는 이 저장소가 잰 적이 없다.
    stop-distance-percent: ${COINWIN_TRADING_STOP_DISTANCE:2}
    # 주문을 보낼 주소. **기본값이 테스트넷이다** — 실계좌 주소(https://fapi.binance.com)는
    # 손으로 적어야 하고, 그 한 줄이 돈이 움직인다는 뜻이다.
    exchange-url: ${COINWIN_TRADING_EXCHANGE_URL:https://testnet.binancefuture.com}
    # 주문을 낼 수 있는 키. **계좌를 읽는 키(coinwin.account.binance)와 다른 값이어야 한다** —
    # 그쪽은 읽기 전용이고 이쪽은 거래 권한이 필요하다. 출금은 양쪽 다 끈다.
    # PAPER 모드에서는 없어도 된다. TESTNET/LIVE 인데 없으면 앱이 뜨지 않는다.
    binance:
      api-key: ${COINWIN_TRADING_BINANCE_API_KEY:}
      secret-key: ${COINWIN_TRADING_BINANCE_SECRET_KEY:}

  watch:
    binance:
      # 공지는 시세와 호스트가 다르다. 그리고 이것은 문서화된 공개 API 가 아니라
      # 바이낸스 웹사이트가 쓰는 것이라 예고 없이 바뀔 수 있다 — 그래서 이 블록의 실패가
      # 다른 블록을 죽이지 않도록 엔드포인트를 따로 두었다.
      base-url: ${COINWIN_BINANCE_CMS_URL:https://www.binance.com}
