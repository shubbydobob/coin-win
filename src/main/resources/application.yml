spring:
  application:
    name: coinwin

  # Phase 3 부터 캔들을 저장한다. 로컬 DB 는 `docker compose up -d db`.
  # 자격 증명을 환경변수로 덮어쓸 수 있게 두되 기본값은 compose.yaml 과 맞춘다.
  datasource:
    url: ${COINWIN_DB_URL:jdbc:postgresql://localhost:5432/coinwin}
    username: ${COINWIN_DB_USER:coinwin}
    password: ${COINWIN_DB_PASSWORD:coinwin}

  # 스키마는 Flyway 만 만든다. Phase 5 에서 JPA 가 들어왔으므로 ddl-auto 를 명시적으로 꺼 둔다 —
  # 기본값에 기대면 Boot 버전이 바뀔 때 Hibernate 가 스키마를 손대기 시작할 수 있고,
  # 그러면 마이그레이션이 유일한 스키마 출처라는 전제가 조용히 무너진다.
  jpa:
    hibernate:
      ddl-auto: none
    # 뷰 렌더링 중에 세션이 열려 있으면 지연 로딩이 어디서든 터진다. 어댑터가 경계를 갖는다.
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  # Phase 7 — Spring AI. 키가 없으면 AI 어댑터 빈이 올라오지 않고 /api/ai/** 만 503 이 된다.
  # 앱과 나머지 기능은 그대로 뜬다. 근거: docs/spec/phase7-spring-ai.md § 8
  # 어떤 모델 자동 구성을 켜고 끄는지는 여기가 아니라 SpringAiEnabledOnlyWithApiKey 에 있다.
  # 테스트 리소스의 application.yml 이 이 파일을 통째로 가리기 때문이다.
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: ${COINWIN_AI_CHAT_MODEL:gpt-5.6-luna}
          # 계획 파싱은 창작이 아니라 옮겨 적기다. 같은 문장은 같은 초안을 내야 한다.
          temperature: 0
      embedding:
        options:
          model: ${COINWIN_AI_EMBEDDING_MODEL:text-embedding-3-small}
    vectorstore:
      pgvector:
        # 스키마는 Flyway 만 만든다. 2.0 기본값이지만 명시한다 — 기본값에 기대면
        # 버전이 바뀔 때 마이그레이션이 유일한 스키마 출처라는 전제가 조용히 무너진다.
        initialize-schema: false
        # V3__vector_store.sql 의 vector(1536) 과 같은 수여야 한다. 차원이 다른 벡터가
        # 한 테이블에 섞이면 검색이 예외 없이 조용히 망가진다.
        dimensions: 1536
        index-type: HNSW
        distance-type: COSINE_DISTANCE

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha

coinwin:
  market:
    binance:
      # 공개 엔드포인트만 쓴다. API 키가 필요 없다. 근거: .claude/docs/scope.md
      base-url: ${COINWIN_BINANCE_URL:https://fapi.binance.com}
      # 바이낸스 klines 는 1회 최대 1500개를 준다. 이보다 크게 요청하면 조용히 잘린다.
      max-candles-per-request: 1500
      connect-timeout: 3s
      read-timeout: 10s
