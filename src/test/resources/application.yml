# 기본 `test` 태스크는 DB 없이 돈다. 이 파일이 그것을 보장한다.
#
# 왜 datasource.url 이 여기 있는가: PostgreSQL 드라이버가 클래스패스에 있는데 URL 이 없으면
# Boot 는 DataSource 빈 생성 자체에서 실패한다("Failed to determine a suitable driver class").
# URL 만 주고 flyway 를 꺼서 실제 접속을 0회로 만든다 — Hikari 풀은 첫 getConnection() 까지
# 커넥션을 열지 않고, Flyway 만이 기동 시점에 곧바로 접속하기 때문이다.
#
# 캔들을 실제로 읽고 쓰는 것은 통합 테스트뿐이고, 그쪽은 Testcontainers 가 이 값을 덮어쓴다.
# 단위 테스트에서 인메모리 어댑터를 쓰려면 Spring 없이 그냥 new 로 만든다.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/coinwin
    username: coinwin
    password: coinwin
  flyway:
    enabled: false

coinwin:
  market:
    binance:
      # 테스트가 실수로 진짜 바이낸스를 때리면 곧바로 드러나야 한다.
      # 계약 테스트는 페이크 서버 주소로 이 값을 덮어쓴다.
      base-url: http://localhost:1
      max-candles-per-request: 1500
      connect-timeout: 1s
      read-timeout: 2s
